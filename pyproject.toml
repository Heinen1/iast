[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iast"
version = "0.1.0"
description = "Ideal Adsorbed Solution Theory for binary Langmuir isotherms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[project.scripts]
iast = "src.main:main"

[tool.setuptools]
packages = ["src"]
